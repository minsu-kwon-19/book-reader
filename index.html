<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2c5146"><meta name="description" content="나만의 속도로 쌓아가는 독서 달력과 책장"><title>책틈 — 나의 독서 달력</title><link rel="stylesheet" href="/style.css"></head><body><div id="app"></div><dialog id="editor"><form id="book-form"><div class="modal-head"><div><span class="eyebrow">MY LITTLE LIBRARY</span><h2 id="modal-title">책장에 책 더하기</h2></div><button type="button" class="icon" id="close-modal" aria-label="닫기">×</button></div><input name="id" type="hidden"><label>책 제목<input name="title" required maxlength="120" placeholder="어떤 책을 읽고 싶나요?"></label><label>저자<input name="author" maxlength="100" placeholder="저자 이름"></label><div class="form-row"><label>독서 상태<select name="status"><option value="want">읽을 책</option><option value="reading">읽는 중</option><option value="done">다 읽은 책</option></select></label><label>책 색상<select name="color"><option value="0">숲 초록</option><option value="1">벽돌 주황</option><option value="2">바다 파랑</option><option value="3">라벤더</option><option value="4">겨자 노랑</option></select></label></div><div class="form-row"><label>전체 페이지<input name="pages" type="number" min="1" max="100000" value="300" required></label><label>읽은 페이지<input name="current" type="number" min="0" value="0" required></label></div><div class="form-row"><label>시작 예정일<input name="start" type="date"></label><label>완독 목표일<input name="end" type="date"></label></div><p class="muted small">기간을 정하면 달력에 독서 계획이 표시돼요.</p><p id="form-error" role="alert"></p><div class="modal-actions"><button type="button" id="delete-book" class="danger">책 삭제</button><button type="submit" class="primary">저장하기 ↗</button></div></form></dialog><input id="import-file" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
